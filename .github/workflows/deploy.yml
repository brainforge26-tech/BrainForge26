name: Production CI/CD Pipeline - BrainForge26

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -e

            APP_DIR="/var/www/BrainForge26"
            echo "🚀 [Deploy] Target Directory: $APP_DIR"

            # Step 1: Ensure workspace exists & clone/pull
            if [ ! -d "$APP_DIR" ]; then
              echo "📁 Directory missing. Cloning repository..."
              git clone https://github.com/brainforge26-tech/BrainForge26.git "$APP_DIR"
            else
              echo "🔄 Directory exists. Fetching latest changes..."
              cd "$APP_DIR"
              git fetch --all
              git reset --hard origin/main
            fi

            cd "$APP_DIR"

            # Step 2: Backend Setup & Seed
            echo "📦 [Backend] Installing dependencies..."
            cd "$APP_DIR/backend"
            if [ ! -f "$APP_DIR/backend/.env" ]; then
              cp "$APP_DIR/backend/.env.production" "$APP_DIR/backend/.env" || true
            fi
            npm install --no-audit

            echo "🗄️  [Backend] Generating Prisma ORM Client..."
            npx prisma generate

            echo "🗃️  [Backend] Ensuring PostgreSQL Database Schema exists..."
            npx prisma db push --accept-data-loss || true

            echo "🌱 [Backend] Executing Production Database Cleanup & Seed..."
            npx prisma db seed || true

            echo "🛠️  [Backend] Compiling TypeScript Backend App..."
            npm run build
            echo "✓ Backend Build Completed."

            # Step 3: Frontend Setup & Build
            echo "📦 [Frontend] Installing dependencies..."
            cd "$APP_DIR/frontend"
            npm install --no-audit

            echo "⚡ [Frontend] Building Next.js Production Bundle..."
            npm run build
            echo "✓ Frontend Build Completed."

            # Step 4: PM2 Service Reload
            echo "🔄 [PM2] Reloading services..."
            cd "$APP_DIR"
            fuser -k 5001/tcp || true
            pm2 startOrReload ecosystem.config.js --env production --update-env || pm2 start ecosystem.config.js --env production
            pm2 save
            echo "✓ PM2 Reload Completed Successfully."
